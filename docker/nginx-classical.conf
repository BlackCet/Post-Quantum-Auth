worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream pharma_gateways {
        server gateway-1:5001;
        server gateway-2:5001;
        server gateway-3:5001;
    }

    server {
        listen 5001 ssl;
        server_name gateway tls-proxy localhost;

        client_max_body_size 256m;
        ssl_protocols TLSv1.3;
        ssl_certificate /tls/gateway.crt;
        ssl_certificate_key /tls/gateway.key;
        ssl_client_certificate /tls/ca.crt;
        ssl_verify_client on;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets on;
        ssl_session_ticket_key /tls/ticket.key;
        ssl_conf_command Groups X25519:P-256;
        ssl_conf_command SignatureAlgorithms ecdsa_secp256r1_sha256;
        ssl_conf_command ClientSignatureAlgorithms ecdsa_secp256r1_sha256;

        location / {
            proxy_pass https://pharma_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header Connection close;
            proxy_http_version 1.0;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_trusted_certificate /tls/backend-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name gateway.internal;
            proxy_ssl_certificate /tls/proxy.crt;
            proxy_ssl_certificate_key /tls/proxy.key;
            proxy_ssl_conf_command Groups X25519:P-256;
            proxy_ssl_conf_command SignatureAlgorithms ecdsa_secp256r1_sha256;
            proxy_ssl_conf_command ClientSignatureAlgorithms ecdsa_secp256r1_sha256;
        }
    }
}
